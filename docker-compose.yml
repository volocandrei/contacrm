name: contacrm

# Development stack.
#
#   docker compose up -d                # doar infrastructura (postgres)
#   docker compose --profile api up -d  # infrastructura + API + worker
#
# Nu există broker. Coada este `document_processing_jobs`, un outbox tranzacțional
# în aceeași bază de date, revendicat cu `FOR UPDATE SKIP LOCKED`. Motivul pentru
# care nu am adus Celery + Redis este scris în `backend/app/worker.py`; pe scurt,
# ar fi însemnat încă un serviciu de rulat, monitorizat și repornit, ca să facă
# exact ce face deja baza de date pe care oricum o avem.
services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-contacrm}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-contacrm_dev_password}
      POSTGRES_DB: ${POSTGRES_DB:-contacrm}
      # Colație stabilă pentru sortarea corectă a diacriticelor.
      LANG: ro_RO.utf8
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-contacrm} -d ${POSTGRES_DB:-contacrm}"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Migrările rulează într-un container separat, care iese după ce termină.
  # API-ul nu pornește până când schema nu este la zi.
  migrate:
    profiles: ["api"]
    build:
      context: ./backend
    command: ["alembic", "upgrade", "head"]
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-contacrm}:${POSTGRES_PASSWORD:-contacrm_dev_password}@postgres:5432/${POSTGRES_DB:-contacrm}
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  backend:
    profiles: ["api"]
    build:
      context: ./backend
    restart: unless-stopped
    # Tot `.env`-ul, nu o listă de variabile. Lista exista, și tocmai de aceea
    # rămânea în urmă: fiecare funcție nouă își aducea variabilele ei, nimeni nu
    # le adăuga și aici, iar containerul pornea cu valorile implicite. Așa au
    # lipsit, la rând, integrările Microsoft (reparat o dată), apoi `SECRET_KEY`,
    # `PUBLIC_BASE_URL`, `CRON_SECRET` și tot SMTP-ul. Ultimele două înseamnă un
    # cabinet care nu poate trimite nimic; primele două opresc pornirea în
    # producție, unde `SECRET_KEY` implicit și `PUBLIC_BASE_URL` pe localhost sunt
    # refuzate — adică drumul descris în DEPLOY.md nu ducea nicăieri.
    #
    # `required: false` ca `docker compose up` să meargă și fără `.env`, ca până
    # acum: valorile implicite din `app/core/config.py` sunt cele de development.
    env_file:
      - path: .env
        required: false
    environment:
      # Doar ce este **al containerului**, și nu poate veni din `.env`: baza se
      # cheamă `postgres` în rețeaua compose, nu `localhost`, iar documentele stau
      # într-un volum, nu în directorul de lucru.
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-contacrm}:${POSTGRES_PASSWORD:-contacrm_dev_password}@postgres:5432/${POSTGRES_DB:-contacrm}
      STORAGE_PATH: /var/lib/contacrm/storage
      ARCHIVE_ROOT: /var/lib/contacrm/storage/ARHIVA
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    volumes:
      # Documentele stau într-un volum, nu în imagine — nu se pierd la rebuild.
      - storage_data:/var/lib/contacrm/storage
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  # Procesarea rulează în afara cererii HTTP — asta este tot rostul lui.
  # Aceeași imagine ca API-ul, alt punct de intrare: nu poate exista o versiune
  # de worker care execută alt cod decât cel din care a venit cererea.
  worker:
    profiles: ["api"]
    build:
      context: ./backend
    command: ["python", "-m", "app.worker"]
    restart: unless-stopped
    # Tot `.env`-ul, nu o listă de variabile. Lista exista, și tocmai de aceea
    # rămânea în urmă: fiecare funcție nouă își aducea variabilele ei, nimeni nu
    # le adăuga și aici, iar containerul pornea cu valorile implicite. Așa au
    # lipsit, la rând, integrările Microsoft (reparat o dată), apoi `SECRET_KEY`,
    # `PUBLIC_BASE_URL`, `CRON_SECRET` și tot SMTP-ul. Ultimele două înseamnă un
    # cabinet care nu poate trimite nimic; primele două opresc pornirea în
    # producție, unde `SECRET_KEY` implicit și `PUBLIC_BASE_URL` pe localhost sunt
    # refuzate — adică drumul descris în DEPLOY.md nu ducea nicăieri.
    #
    # `required: false` ca `docker compose up` să meargă și fără `.env`, ca până
    # acum: valorile implicite din `app/core/config.py` sunt cele de development.
    env_file:
      - path: .env
        required: false
    environment:
      # Doar ce este **al containerului**, și nu poate veni din `.env`: baza se
      # cheamă `postgres` în rețeaua compose, nu `localhost`, iar documentele stau
      # într-un volum, nu în directorul de lucru.
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-contacrm}:${POSTGRES_PASSWORD:-contacrm_dev_password}@postgres:5432/${POSTGRES_DB:-contacrm}
      STORAGE_PATH: /var/lib/contacrm/storage
      ARCHIVE_ROOT: /var/lib/contacrm/storage/ARHIVA
    volumes:
      # Același volum ca API-ul: workerul citește originalul pe care l-a scris
      # uploadul și scrie arhiva pe care o va descărca cineva prin API.
      - storage_data:/var/lib/contacrm/storage
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

volumes:
  postgres_data:
  storage_data:
