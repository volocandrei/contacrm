name: contacrm

# Development stack.
#
#   docker compose up -d                # doar infrastructura (postgres)
#   docker compose --profile api up -d  # infrastructura + API + worker
#
# Nu există broker. Coada este `document_processing_jobs`, un outbox tranzacțional
# în aceeași bază de date, revendicat cu `FOR UPDATE SKIP LOCKED`. Motivul pentru
# care nu am adus Celery + Redis este scris în `backend/app/worker.py`; pe scurt,
# ar fi însemnat încă un serviciu de rulat, monitorizat și repornit, ca să facă
# exact ce face deja baza de date pe care oricum o avem.
services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-contacrm}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-contacrm_dev_password}
      POSTGRES_DB: ${POSTGRES_DB:-contacrm}
      # Colație stabilă pentru sortarea corectă a diacriticelor.
      LANG: ro_RO.utf8
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-contacrm} -d ${POSTGRES_DB:-contacrm}"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Migrările rulează într-un container separat, care iese după ce termină.
  # API-ul nu pornește până când schema nu este la zi.
  migrate:
    profiles: ["api"]
    build:
      context: ./backend
    command: ["alembic", "upgrade", "head"]
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-contacrm}:${POSTGRES_PASSWORD:-contacrm_dev_password}@postgres:5432/${POSTGRES_DB:-contacrm}
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  backend:
    profiles: ["api"]
    build:
      context: ./backend
    restart: unless-stopped
    environment:
      ENVIRONMENT: ${ENVIRONMENT:-development}
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-contacrm}:${POSTGRES_PASSWORD:-contacrm_dev_password}@postgres:5432/${POSTGRES_DB:-contacrm}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:5173}
      # Implicit `mock`: niciun document nu părăsește mașina în development (R2).
      OCR_PROVIDER: ${OCR_PROVIDER:-mock}
      AI_PROVIDER: ${AI_PROVIDER:-mock}
      STORAGE_PATH: /var/lib/contacrm/storage
      ARCHIVE_ROOT: /var/lib/contacrm/storage/ARHIVA
      # Integrările externe. Fără ele, ecranele spun cinstit că nu sunt
      # configurate — dar workerul are nevoie de aceleași valori ca API-ul:
      # el este cel care sincronizează, și fără `DRIVE_TOKEN_KEY` nu poate
      # descifra tokenurile pe care le-a stocat API-ul.
      MS_CLIENT_ID: ${MS_CLIENT_ID:-}
      MS_CLIENT_SECRET: ${MS_CLIENT_SECRET:-}
      MS_TENANT_ID: ${MS_TENANT_ID:-common}
      MS_REDIRECT_URI: ${MS_REDIRECT_URI:-http://localhost:5173/administrare/surse}
      ANAF_CLIENT_ID: ${ANAF_CLIENT_ID:-}
      ANAF_CLIENT_SECRET: ${ANAF_CLIENT_SECRET:-}
      ANAF_REDIRECT_URI: ${ANAF_REDIRECT_URI:-http://localhost:5173/administrare/e-factura}
      ANAF_ENVIRONMENT: ${ANAF_ENVIRONMENT:-prod}
      DRIVE_TOKEN_KEY: ${DRIVE_TOKEN_KEY:-}
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    volumes:
      # Documentele stau într-un volum, nu în imagine — nu se pierd la rebuild.
      - storage_data:/var/lib/contacrm/storage
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  # Procesarea rulează în afara cererii HTTP — asta este tot rostul lui.
  # Aceeași imagine ca API-ul, alt punct de intrare: nu poate exista o versiune
  # de worker care execută alt cod decât cel din care a venit cererea.
  worker:
    profiles: ["api"]
    build:
      context: ./backend
    command: ["python", "-m", "app.worker"]
    restart: unless-stopped
    environment:
      ENVIRONMENT: ${ENVIRONMENT:-development}
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-contacrm}:${POSTGRES_PASSWORD:-contacrm_dev_password}@postgres:5432/${POSTGRES_DB:-contacrm}
      OCR_PROVIDER: ${OCR_PROVIDER:-mock}
      AI_PROVIDER: ${AI_PROVIDER:-mock}
      STORAGE_PATH: /var/lib/contacrm/storage
      ARCHIVE_ROOT: /var/lib/contacrm/storage/ARHIVA
      # Integrările externe. Fără ele, ecranele spun cinstit că nu sunt
      # configurate — dar workerul are nevoie de aceleași valori ca API-ul:
      # el este cel care sincronizează, și fără `DRIVE_TOKEN_KEY` nu poate
      # descifra tokenurile pe care le-a stocat API-ul.
      MS_CLIENT_ID: ${MS_CLIENT_ID:-}
      MS_CLIENT_SECRET: ${MS_CLIENT_SECRET:-}
      MS_TENANT_ID: ${MS_TENANT_ID:-common}
      MS_REDIRECT_URI: ${MS_REDIRECT_URI:-http://localhost:5173/administrare/surse}
      ANAF_CLIENT_ID: ${ANAF_CLIENT_ID:-}
      ANAF_CLIENT_SECRET: ${ANAF_CLIENT_SECRET:-}
      ANAF_REDIRECT_URI: ${ANAF_REDIRECT_URI:-http://localhost:5173/administrare/e-factura}
      ANAF_ENVIRONMENT: ${ANAF_ENVIRONMENT:-prod}
      DRIVE_TOKEN_KEY: ${DRIVE_TOKEN_KEY:-}
    volumes:
      # Același volum ca API-ul: workerul citește originalul pe care l-a scris
      # uploadul și scrie arhiva pe care o va descărca cineva prin API.
      - storage_data:/var/lib/contacrm/storage
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

volumes:
  postgres_data:
  storage_data:
